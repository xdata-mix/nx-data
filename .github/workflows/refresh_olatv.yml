name: refresh-olatv

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'   # toutes les 4h (aligne sur le cron-job.org OlaTV)

concurrency:
  group: refresh-olatv-only
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install requests pycryptodome

      - name: Probe serveurs OlaTV (FR) -> live-cids.json
        env:
          OLA_ONLY_FR: '1'
          OLA_OUT: data/olatv/live-cids.json
        run: python scripts/olatv/refresh_olatv.py

      - name: Valider et pousser si modifie
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/olatv/live-cids.json || true
          if git diff --cached --quiet; then
            echo "Aucun changement OlaTV."
          else
            git pull --rebase origin main || true
            git commit -m "chore(olatv): refresh live-cids [skip ci]"
            git push origin main
          fi

      - name: Nettoyage automatique des anciens flux de travail
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 5

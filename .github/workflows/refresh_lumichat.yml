# Recupere les chaines LumiChat (FR), regenere data/lumichat/data-lumichat.m3u.
# Plus de probe gateway (instable) -- on inclut toutes les chaines FR de l'API.
name: refresh-lumichat
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh-lumichat-only
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup WARP (1.1.1.1)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl start warp-svc
          sleep 2
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 5
          echo "WARP status:" && warp-cli status || true
          curl -s https://cloudflare.com/cdn-cgi/trace | grep warp || true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Refresh LumiChat M3U (FR)
        env:
          LUMI_COUNTRY: 'FR'
          LUMI_SKIP_DEAD: '1'
          LUMI_PROVIDERS: 'PRO,ULTRA'
          LUMI_OUT: 'data/lumichat/data-lumichat.m3u'
          LUMI_API_TIMEOUT: '25'
          LUMI_API_TRIES: '3'
        run: python scripts/lumichat/refresh_lumichat.py
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lumichat/data-lumichat.m3u
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "auto: refresh data/lumichat/data-lumichat.m3u (FR)"
            git pull --rebase origin main || git rebase --abort
            git push
          fi
      - name: Auto-cleanup old workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 5

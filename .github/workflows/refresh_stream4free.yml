name: Actualiser Stream4Free

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Xvfb + Chrome)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          google-chrome --version || echo "Chrome not pre-installed"

      - name: Install Python dependencies
        run: |
          pip install nodriver pyvirtualdisplay

      - name: Run Stream4Free scraper
        run: python scripts/refresh_stream4free.py

      - name: Combine into data-replay.m3u (if combine script exists)
        if: always()
        run: |
          if [ -f scripts/combine_replays.py ]; then
            python scripts/combine_replays.py
          fi

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-stream4free.m3u
          if [ -f data-replay.m3u ]; then git add data-replay.m3u; fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: refresh stream4free (nodriver)"
            git pull --rebase origin main
            git push
          fi

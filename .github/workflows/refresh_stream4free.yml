name: Refresh Stream4Free

on:
  schedule:
    - cron: '0 */6 * * *'  # toutes les 6h
  workflow_dispatch:       # trigger manuel

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Camoufox
        run: |
          pip install camoufox[geoip]
          python -m camoufox fetch

      - name: Setup WARP (1.1.1.1)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 5
          curl -s https://cloudflare.com/cdn-cgi/trace | grep warp

      - name: Run Stream4Free scraper
        run: python scripts/refresh_stream4free.py

      - name: Combine into data-replay.m3u (if combine script exists)
        run: |
          if [ -f scripts/combine_replays.py ]; then
            python scripts/combine_replays.py
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-stream4free.m3u
          if [ -f data-replay.m3u ]; then git add data-replay.m3u; fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: refresh stream4free"
            git push
          fi
